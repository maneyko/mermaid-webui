---
- name: Install bun
  include_role:
    name: maneyko.roles.bun
  vars:
    bun_users: ["{{ config.owner }}"]

- name: Clone mermaid-webui repo
  # The vhost is a file in here, reached through a symlink that does not change
  # when its target does -- so without this, a config.version bump deploys a new
  # vhost and leaves NGINX running the old one.
  notify: Reload NGINX
  # Set mermaid-webui permissions below hands the checkout to config.owner, so
  # root's git refuses it as dubious on every run after the first. The exception
  # is scoped to this task rather than written into the host's git config.
  environment:
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: "{{ mermaid_webui_root }}"
  git:
    accept_hostkey: true
    repo: "{{ mermaid_webui_repo }}"
    version: "{{ config.version | default('main') }}"
    dest: "{{ mermaid_webui_root }}"

# NGINX reads dist/ through the group; nobody outside it reads the checkout at
# all. Runs before the build, so node_modules and dist inherit www-data from
# the setgid bit rather than being swept by the next apply.
- name: Set mermaid-webui permissions
  changed_when: false
  shell: |
    chown -R {{ config.owner }}:www-data {{ mermaid_webui_root }}
    find {{ mermaid_webui_root }} -type d -exec chmod 2750 {} +
    find {{ mermaid_webui_root }} -type f -exec chmod g-w,o= {} +

# Frozen because bun.lock is in the repo: a host that resolves something else
# is serving a bundle no checkout of this commit reproduces.
- name: Install mermaid-webui dependencies
  become_user: "{{ config.owner }}"
  changed_when: false
  command:
    chdir: "{{ mermaid_webui_root }}"
    cmd: bun install --frozen-lockfile

# node_modules/.bin/tsc and .../vite are both `#!/usr/bin/env node`, and this
# host has no node. bun runs node's entry points when it is invoked under that
# name, the same trick maneyko.roles.bun uses for bunx. `bun --bun run build`
# is the documented way to ask for it and works interactively, but silently
# does nothing for root -- and root is who this runs as wherever the inventory
# pins ansible_become_user, which outranks the become_user below.
- name: Create the directory holding node for the build
  file:
    state: directory
    path: "{{ mermaid_webui_libexec }}"
    mode: '0755'

- name: Point node at bun
  file:
    state: link
    src:  "{{ mermaid_webui_bun_binary }}"
    dest: "{{ mermaid_webui_libexec }}/node"

# Only on PATH for the build: nothing else on this host should find a node.
- name: Build mermaid-webui
  become_user: "{{ config.owner }}"
  changed_when: false
  environment:
    PATH: "{{ mermaid_webui_libexec }}:{{ ansible_facts.env.PATH }}"
  command:
    chdir: "{{ mermaid_webui_root }}"
    cmd: bun run build

- name: Link mermaid-webui NGINX site
  notify: Reload NGINX
  file:
    state: link
    src:  "{{ mermaid_webui_root }}/etc/nginx/mermaid-webui.conf"
    dest: /etc/nginx/sites-enabled/mermaid-webui.conf

# Written straight to the snippet rather than into the checkout: what this host
# answers to is the caller's, and the repo does not ignore that path.
- name: Write mermaid-webui NGINX local snippet
  no_log: true
  notify: Reload NGINX
  copy:
    content: "{{ secrets.nginx.local_conf }}"
    dest: /etc/nginx/snippets/mermaid-webui.local.conf
    group: www-data
    mode: '0640'
