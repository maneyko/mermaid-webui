# Loopback only. The Cloudflare Tunnel is the sole route in, which is what puts
# Cloudflare Access genuinely in front of this rather than merely beside it --
# a public listener would still answer a request that skipped the edge. TLS is
# terminated by Cloudflare, so there is no certificate here.
server {
    listen 127.0.0.1:8080;

    # No client-side router, so a path that is not a file is a 404 rather than
    # a fallback to index.html.
    root /opt/mermaid-webui/dist;
    index index.html;
}
