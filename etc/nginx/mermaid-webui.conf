# Two routes to the same bundle. The loopback block is reachable only through
# the Cloudflare Tunnel, so Cloudflare Access -- which is enforced at the edge
# and nowhere else -- covers every request that gets to it. The public block
# answers on this host's own address, where none of that runs.
#
# The names must not be shared between the two. One block listening on both
# would serve the tunnel's name on the public address too, and that name's
# Access policy would become decoration.

server {
    # Sole listener on this port, so whatever proxies here has already chosen
    # the name and there is nothing for server_name to pick between.
    listen 127.0.0.1:8080;

    # No client-side router, so a path that is not a file is a 404 rather than
    # a fallback to index.html.
    root /opt/mermaid-webui/dist;
    index index.html;
}

server {
    include snippets/default-cert.conf;

    # Contains server_name
    include snippets/mermaid-webui.local.conf;

    root /opt/mermaid-webui/dist;
    index index.html;
}
